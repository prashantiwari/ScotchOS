# ScotchOS Hourly Quote settings. Saved changes apply right away, no restart needed.

# Where the card sits on each screen:
#   top-left     top      top-right
#   left         center   right
#   bottom-left  bottom   bottom-right
position = bottom-right

# Distance in px from the screen edges the card touches (ignored on a centered axis).
margin_x = 20
margin_y = 20

# Minutes between new quotes.
interval = 60
