# cava settings for the Now Playing widget. NowPlayingWidget.qml reads the raw output, one frame per line.
# Changes need a widget restart (the visualizer restarts on its own the next time music plays).

[general]
# Must match `barCount` in NowPlayingWidget.qml.
bars = 32
# Frames per second. 30 looks smooth and keeps the redraws cheap.
framerate = 30
autosens = 1

[input]
# The monitor of the default output, so it hears every app: Spotify, Brave, games, calls.
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
# 59 is ";" between bars, 10 is a newline after each frame.
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 77
