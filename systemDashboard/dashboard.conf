# ScotchOS system dashboard settings. Saved changes apply right away, no restart needed.

# vertical   : a tall card on the left edge of the screen (the original layout)
# horizontal : a wide strip along the bottom edge, with the sections side by side
# square     : a squarish card on the left edge: rings on top, then CPU and top processes | network and GPU
layout = square

# Where the card sits on each screen:
#   top-left     top      top-right
#   left         center   right
#   bottom-left  bottom   bottom-right
# auto (default): left for vertical and square, bottom for horizontal
position = auto

# Distance in px from the screen edges the card touches (ignored on a centered axis).
# Measured from waybar's edge, not the screen's, when the card sits on waybar's side.
margin_x = 20
margin_y = 20
