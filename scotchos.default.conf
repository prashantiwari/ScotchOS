# ScotchOS settings, read from ~/.config/scotchos/scotchos.conf ($XDG_CONFIG_HOME/scotchos). The repo's
# scotchos.default.conf holds the defaults; `scotchos start` copies it there when the file is missing.
# Saved changes apply right away, no restart needed:
# switching a widget off unloads it (and stops its helper processes), switching it on loads it.
# Or from a terminal: `scotchos enable <name>` / `scotchos disable <name>`.
# A "#" starts a comment at the start of a line or after a space; inside a value (a URL's #fragment) it's kept.

[enabled]
dashboard  = yes    # system monitor: rings, graphs, GPU, disk, battery, top processes
nowplaying = yes    # current track with album art and a cava visualizer
quote      = yes    # a new quote from the web every hour
claudeusage = yes   # Claude plan usage: 5-hour and 7-day limits
launcher   = yes    # Super+Y launcher: apps, YouTube search and ScotchOS commands in one box
dailytheory = yes   # dailyTheory client window, opened from the app launcher
reader     = yes    # e-reader: EPUB, MOBI, AZW3, FB2, TXT, MD from ~/Books, opened from the app launcher

# Positions, for every widget below:
#   top-left     top      top-right
#   left         center   right
#   bottom-left  bottom   bottom-right
# margin_x / margin_y: distance in px from the screen edges the card touches (ignored on a centered axis).
# Measured from waybar's edge, not the screen's, when the card sits on waybar's side.

[dashboard]
# vertical   : a tall card, the sections stacked
# horizontal : a wide strip, the sections side by side
# square     : rings and a clock on top, then CPU and top processes | network and GPU
layout   = vertical
# auto: left for vertical and square, bottom for horizontal
position = auto
margin_x = 20
margin_y = 20
# Bars for the root filesystem and the battery (the battery hides itself on a desktop)
show_disk    = yes
show_battery = yes

[nowplaying]
position    = right
margin_x    = 20
margin_y    = 20
# Keep the card on screen while the music is paused (yes / no).
show_paused = yes
# card (art, details, progress, bars) / radial (only the art in a wavy circle, bars as rays around it).
layout      = card
# Visualizer behind the art (card layout): middle (around the art row) / bar (rising from the progress bar).
visualizer  = middle
# Size of the radial layout, in % of its base size (50 - 160).
radial_size = 100

[quote]
position = bottom-right
margin_x = 20
margin_y = 20
# Minutes between new quotes.
interval = 60

[claudeusage]
# full    : bars and reset countdowns
# compact : one small line with just the two percentages
# minimal : a title bar and the two percentages, large
size     = full
position = top-right
margin_x = 20
margin_y = 20
# Minutes between fetches (minimum 5). It also fetches once every time the shell starts, i.e. at login.
interval = 30
# Percentage at which a bar turns red.
warn     = 80
# Desktop notification (notify-send) once when a limit reaches `warn`, again only after it drops below and
# climbs back, e.g. after its window resets.
notify   = yes
# Claude Code sessions open in terminals (from ~/.claude/sessions): a list on full and minimal, busy/open on compact.
sessions = yes

[launcher]
# YouTube search: the browser command (the URL is added at the end), the class of its windows in
# `hyprctl clients`, and the workspace it opens on (focus comes back afterwards).
# Firefox: browser = firefox --private-window, browser_class = firefox
browser       = brave --incognito --new-window
browser_class = brave-browser
workspace     = 1

[dailytheory]
# The dailyTheory API (`go run ./cmd/server` in the dailyTheory repo; `./cmd/mockserver` is an offline stand-in).
server           = http://localhost:8080
# Only if the server sets REGISTRATION_KEY; sent on signup only.
registration_key =

[reader]
# Folder scanned (with subfolders) for .epub .mobi .azw3 .azw .fb2 .fb2.zip .txt .md
library_dir = ~/Books
# pages: turn pages like a Kindle / scroll: each chapter is one scrolling column (S switches)
layout      = pages
# Font family for book text (any name fc-list knows; "serif" lets fontconfig pick; A lists the installed ones)
font        = serif
# Text size in px (+ / -), max column width in px (] / [), line spacing in % (. / ,)
font_size   = 16
width       = 720
line_height = 150
# column: one column at most `width` wide / full: the whole width / two: two pages side by side (W switches)
page_layout = column
# Justify paragraphs (yes / no; Shift+J switches)
justify     = no
# Time left in the chapter and the book on the status line, from your reading speed (learned as you read)
time_left   = yes
